# ABOUTME: Machine backstop for the next spec-currency step, so version discipline is not memory-bound.
# ABOUTME: The repo is on FastMCP 4.0; this watches for the next major line (5.x) reaching stable.
name: Spec currency reminder

on:
  schedule:
    - cron: "0 8 * * 1" # weekly, Monday 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open a tracking issue when FastMCP 4.0 reaches a stable (non-prerelease) release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The repo migrated to stable FastMCP 4.0 on 2026-09-17. The next migration decision is the
          # 5.x line; when a stable (non-prerelease) 5.x appears on PyPI, open a tracking issue.
          latest_stable=$(curl -s https://pypi.org/pypi/fastmcp/json \
            | python3 -c "import sys,json; d=json.load(sys.stdin);
          import re
          def is_final(v): return re.fullmatch(r'[0-9]+(\.[0-9]+)*', v) is not None
          nxt=[v for v in d['releases'] if v.startswith('5.') and is_final(v)]
          print(sorted(nxt)[-1] if nxt else '')")
          if [ -z "$latest_stable" ]; then
            echo "No stable FastMCP 5.x yet. Nothing to do."
            exit 0
          fi
          echo "Stable FastMCP $latest_stable is available."
          title="Evaluate migrating to FastMCP 5.x"
          existing=$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "Tracking issue #$existing already open; leaving it."
            exit 0
          fi
          body=$(printf '%s\n' \
            "Stable FastMCP $latest_stable is on PyPI. The repo is on the 4.0 line. Per docs/spec-currency.md, evaluate the move:" \
            "" \
            "- [ ] Check what MCP spec revision the 5.x line implements, and whether a newer revision is current." \
            "- [ ] Measure first: bump one package, run its suite, and size the migration before committing to it." \
            "- [ ] Re-pin every package together so the lockdrift check stays green." \
            "- [ ] Refresh docs/spec-currency.md and the stack table in AGENTS.md." \
            "" \
            "Opened automatically by the spec-currency-reminder workflow.")
          gh issue create --repo "$REPO" --title "$title" --body "$body"
