[project]
name = "mcp-quiz"
version = "0.1.0"
description = "An MCP exam quiz app: a versioned question bank, pure scoring, and a FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "pyyaml>=6",
    "structlog>=24",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# hatchling's package inclusion ships every file under src/mcp_quiz (questions.yaml and static/
# included), verified by inspecting the built wheel; a force-include here would double-add them and
# fail the build. The CI wheel-parity smoke test guards this so a packaging regression cannot pass
# source-tree tests and 404 only in the deployed wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/mcp_quiz"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15.20", "httpx>=0.27", "mypy>=2.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Starlette's TestClient warns that httpx will be replaced by httpx2; third-party, not our code.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
