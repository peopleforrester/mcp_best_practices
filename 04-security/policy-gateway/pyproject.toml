[project]
name = "mcp-policy-gateway"
version = "0.1.0"
description = "Policy-enforcing gateway core for MCP: allowlist, per-client consent, OPA-style rules, SIEM audit"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1.4,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_policy_gateway"]

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1", "ruff>=0.17.3", "mypy>=2.4.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
